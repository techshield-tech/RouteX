name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  ui:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        working-directory: apps/ui
        run: bun install --frozen-lockfile

      - name: Build UI
        working-directory: apps/ui
        run: bun run build

      - uses: actions/upload-artifact@v7
        with:
          name: ui-dist
          path: apps/ui/dist

  linux:
    needs: ui
    name: linux (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
            arch: x86_64
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            arch: aarch64
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/server

      - name: Build
        working-directory: apps/server
        run: cargo build --release --locked --target ${{ matrix.target }}

      - uses: actions/download-artifact@v8
        with:
          name: ui-dist
          path: ui-dist

      - name: Compute version
        id: meta
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="${GITHUB_SHA::7}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Cargo package name is "server" (see apps/server/Cargo.toml), so the
      # built binary is `server` — rename it to `routex` when staging.
      - name: Stage release package
        shell: bash
        run: |
          name="routex-${{ steps.meta.outputs.version }}-linux-${{ matrix.arch }}"
          mkdir -p "$name/bin" "$name/ui"
          cp "apps/server/target/${{ matrix.target }}/release/server" "$name/bin/routex"
          chmod +x "$name/bin/routex"
          cp -r ui-dist/. "$name/ui/"
          cp scripts/install.sh "$name/install.sh"
          chmod +x "$name/install.sh"
          cp LICENSE "$name/LICENSE"
          cp README.md "$name/README.md"
          tar czf "${name}.tar.gz" "$name"
          sha256sum "${name}.tar.gz" > "${name}.tar.gz.sha256"

      - uses: actions/upload-artifact@v7
        with:
          name: routex-${{ steps.meta.outputs.version }}-linux-${{ matrix.arch }}
          path: |
            routex-${{ steps.meta.outputs.version }}-linux-${{ matrix.arch }}.tar.gz
            routex-${{ steps.meta.outputs.version }}-linux-${{ matrix.arch }}.tar.gz.sha256

  windows:
    needs: ui
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/server

      - name: Build
        working-directory: apps/server
        run: cargo build --release --locked --target x86_64-pc-windows-msvc

      - uses: actions/download-artifact@v8
        with:
          name: ui-dist
          path: ui-dist

      - name: Compute version
        id: meta
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="${GITHUB_SHA::7}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Cargo package name is "server", so the built binary is `server.exe`
      # — rename it to `routex.exe` when staging.
      - name: Stage release package
        shell: bash
        run: |
          name="routex-${{ steps.meta.outputs.version }}-windows-x86_64"
          mkdir -p "$name/ui"
          cp "apps/server/target/x86_64-pc-windows-msvc/release/server.exe" "$name/routex.exe"
          cp -r ui-dist/. "$name/ui/"
          cp LICENSE "$name/LICENSE"
          cp README.md "$name/README.md"
          cat > "$name/start.bat" <<'EOF'
          @echo off
          set ROUTEX_UI_DIR=%~dp0ui
          set ROUTEX_DB=%~dp0routex.db
          set ROUTEX_API_ADDR=127.0.0.1:8090
          start "" "%~dp0routex.exe"
          timeout /t 2 >nul
          start http://127.0.0.1:8090
          EOF

      - name: Zip release package
        shell: pwsh
        run: |
          $name = "routex-${{ steps.meta.outputs.version }}-windows-x86_64"
          Compress-Archive -Path $name -DestinationPath "$name.zip"
          $hash = (Get-FileHash -Algorithm SHA256 "$name.zip").Hash.ToLower()
          "$hash  $name.zip" | Out-File -Encoding ascii -NoNewline:$false "$name.zip.sha256"

      - uses: actions/upload-artifact@v7
        with:
          name: routex-${{ steps.meta.outputs.version }}-windows-x86_64
          path: |
            routex-${{ steps.meta.outputs.version }}-windows-x86_64.zip
            routex-${{ steps.meta.outputs.version }}-windows-x86_64.zip.sha256

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/**/*.tar.gz
            artifacts/**/*.tar.gz.sha256
            artifacts/**/*.zip
            artifacts/**/*.zip.sha256
